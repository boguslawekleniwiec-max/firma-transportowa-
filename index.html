<script>
const HUBS=[

{id:'RTM',name:'Rotterdam',country:'NL',type:'Port + centrum dystrybucji',capacity:97,parking:46,services:['warsztat','paliwo','prysznic','hotel'],handling:1.4},
{id:'ANT',name:'Antwerpia',country:'BE',type:'Portowy hub kontenerowy',capacity:93,parking:40,services:['paliwo','prysznic','hotel'],handling:1.25},
{id:'PRG',name:'Praga',country:'CZ',type:'Hub Europy Środkowej',capacity:79,parking:26,services:['warsztat','paliwo','prysznic'],handling:1.0},
{id:'FRA',name:'Frankfurt',country:'DE',type:'Mega centrum cargo',capacity:95,parking:44,services:['warsztat','paliwo','prysznic','hotel'],handling:1.15},
{id:'MIL',name:'Mediolan',country:'IT',type:'Hub południowy',capacity:87,parking:31,services:['warsztat','paliwo','prysznic','hotel'],handling:1.2},
{id:'KRZ',name:'Krzyżowice',country:'PL',type:'Dolnośląski hub A4',capacity:94,parking:45,services:['warsztat','paliwo','prysznic','hotel'],handling:1.0},
{id:'KAT',name:'Kąty Wrocławskie',country:'PL',type:'Hub dystrybucyjny A4',capacity:92,parking:40,services:['warsztat','paliwo','prysznic'],handling:1.0},
{id:'DZL',name:'Dzierżoniów',country:'PL',type:'Regionalne centrum przemysłowe',capacity:68,parking:18,services:['warsztat','paliwo','parking'],handling:1.15},
{id:'BIE',name:'Bielany Wrocławskie',country:'PL',type:'Mega centrum dystrybucyjne',capacity:97,parking:55,services:['warsztat','paliwo','prysznic','hotel'],handling:.9}
];
const CARGO=[
['AGD',18,2.3],['Elektronika',12,3.5],['Żywność',20,2.0],['Części samochodowe',22,2.6],
['Napoje',24,1.8],['Chemia ADR',18,3.8],['Stal',24,2.1],['Odzież',14,2.7],['Mrożonki',18,3.2]
];
const TRUCKS=[
{name:'MAN TGX 18.500',price:185000,year:2018,power:500,cons:29,cap:24},
{name:'DAF XG 480',price:215000,year:2021,power:480,cons:27,cap:24},
{name:'Volvo FH 500',price:285000,year:2022,power:500,cons:28,cap:25},
{name:'Scania R 500',price:310000,year:2023,power:500,cons:27,cap:25},
{name:'Volvo FH16 750',price:480000,year:2023,power:750,cons:34,cap:25,heavy:true},
{name:'Scania R 770 V8',price:560000,year:2024,power:770,cons:36,cap:25,heavy:true}
];
const NAMES=['Marek','Paweł','Kamil','Tomasz','Łukasz','Michał','Robert','Daniel'];
const SPECIAL_DRIVERS=[
 {name:'Marian',unlockKm:15000,skill:100,safety:100,economy:100,salary:11500,bio:'📻 Król CB radia — zna każdą stację, każdy parking i pół Europy.'},
 {name:'Piotrek',unlockKm:30000,skill:110,safety:110,economy:110,salary:14000,bio:'🔥 Specjalista. Statystyki 110/110/110, ale najpierw trzeba sobie na niego zapracować.'}
];
let tab='company', state=load();
const OVERLOAD_CARGO=[
 {name:'Przęsła do mostu',minPower:650,minSkill:90,minSafety:90,dist:220,payPerKm:13.5,weight:48,desc:'Ładunek ponadgabarytowy — wymaga pilotażu i mocnego zestawu.'},
 {name:'Skrzydło turbiny wiatrowej',minPower:700,minSkill:95,minSafety:92,dist:340,payPerKm:16.8,weight:32,desc:'Długi ładunek specjalny. Wymaga bardzo doświadczonego kierowcy.'},
 {name:'Transformator energetyczny',minPower:750,minSkill:100,minSafety:95,dist:280,payPerKm:19.5,weight:58,desc:'Ciężki gabaryt — tylko najmocniejsze zestawy.'},
 {name:'Konstrukcja stalowa',minPower:650,minSkill:88,minSafety:88,dist:410,payPerKm:12.8,weight:44,desc:'Duży element konstrukcyjny. Liczy się moc i bezpieczeństwo.'}
];


const TRAILERS=[
 {type:'Firanka',price:65000,cap:24,desc:'Uniwersalna naczepa do AGD, elektroniki, odzieży i części.'},
 {type:'Chłodnia',price:115000,cap:24,desc:'Temperatura kontrolowana — żywność i mrożonki.'},
 {type:'Mega',price:92000,cap:24,desc:'Duża objętość — odzież, elektronika i lekkie ładunki.'},
 {type:'Cysterna',price:145000,cap:28,desc:'Ładunki płynne; część zleceń wymaga ADR.'},
 {type:'Kontener',price:78000,cap:28,desc:'Kontenery portowe i intermodalne.'},
 {type:'Platforma',price:70000,cap:26,desc:'Stal, maszyny i ładunki otwarte.'},
 {type:'Niskopodwoziowa',price:135000,cap:60,desc:'Gabaryty i ciężkie maszyny.'}
];
const CLIENTS=['LG Logistics','IKEA Supply','Kuehne+Nagel','DB Schenker','DHL Freight','Bosch Logistics','Volkswagen Group','Decathlon Logistics'];
const CONTRACT_LANES=[['KRZ','BER'],['BIE','HAM'],['WRO','DUI'],['KAT','RTM'],['POZ','BER'],['WRO','PRG'],['HAM','ANT'],['DUI','MIL']];
const ACHIEVEMENTS=[
 ['10k','Pierwsze 10 000 km',10000],['100k','100 000 km firmy',100000],['profit100','100 000 zł zysku',100000],['fleet5','Flota 5 ciężarówek',5],['contract','Pierwszy kontrakt',1],['overload','Pierwszy gabaryt',1],['rating5','Klient dał 5 gwiazdek',1],['coffee','Kawa w trasie',1],['cb','Pierwszy komunikat CB',1]
];
function ensureAchievements(){if(!state.achievements)state.achievements=[]}
function unlockAchievement(id,text){ensureAchievements();if(!state.achievements.includes(id)){state.achievements.push(id);log('🏆 Osiągnięcie: '+text);state.rep=Math.min(100,state.rep+1)}}
function activeTrailer(){return state.trailers?.find(t=>t.id===state.activeTrailerId)||state.trailers?.[0]}
function trailerType(){return activeTrailer()?.type||'Firanka'}
function trailerAllows(cargo){const tt=trailerType(); if(cargo==='Mrożonki'||cargo==='Żywność')return tt==='Chłodnia'; if(cargo==='Chemia ADR')return tt==='Cysterna'||state.adrLicense; if(cargo==='Stal')return ['Platforma','Firanka','Niskopodwoziowa'].includes(tt); return ['Firanka','Mega','Kontener','Platforma','Chłodnia'].includes(tt)}
function fatigueFactor(){return Math.max(0.65,1-(100-state.energy)*0.002)}

function fresh(){
 return {money:150000,day:1,rep:50,weekDrive:0,fortDrive:0,companyKm:0,driverId:1,truckId:1,nextDriver:2,plateSeq:1,coffee:0,coffeeSips:0,cigarettes:0,
   drivers:[{id:1,name:'Marek',skill:68,safety:74,economy:66,salary:6500,driveToday:0,driveWeek:0,shift:0,restDue:0}],
   trucks:[{id:1,currentHub:'Krzyżowice',model:'MAN TGX 18.500',year:2018,km:740000,power:500,cons:29,condition:78,value:185000,driverId:1,fuel:72,plate:'DWR 00001',mods:{engine:0,tires:0,tank:0,comfort:0}}],
   trailers:[{id:1,type:'Firanka',cap:24,value:65000,condition:88}],
   jobs:[],activeJob:null,progress:0,loaded:false,hub:null,logs:['Dzień 1: firma została otwarta. Jeden MAN czeka na trasę.'],
   hubState:{},lastEvent:'',routeVersion:2,gameVersion:3,activeTrailerId:1,contracts:[],loans:[],leasePayments:[],events:[],achievements:[],ratings:[],base:{name:'Krzyżowice',level:1,warehouse:0,workshop:0,dispatchers:0},
   break15:false,break45Due:false,energy:100,hunger:20,morale:75,routeRisk:0,weekRestHours:0,nightWork:0,adrLicense:false
 };
}
function load(){try{const x=JSON.parse(localStorage.ft20)||fresh(); if(x.companyKm==null)x.companyKm=0; if(x.driverId==null)x.driverId=x.drivers?.[0]?.id||1; if(x.truckId==null)x.truckId=x.trucks?.[0]?.id||1; if(x.plateSeq==null)x.plateSeq=1; if(x.coffee==null)x.coffee=0; if(x.coffeeSips==null)x.coffeeSips=0; if(x.cigarettes==null)x.cigarettes=0; x.trucks?.forEach((t,i)=>{if(!t.plate)t.plate='DWR '+String(i+1).padStart(5,'0'); if(!t.mods)t.mods={engine:0,tires:0,tank:0,comfort:0}; if(!t.currentHub)t.currentHub=x.hub||x.base?.name||'Krzyżowice'});
 if(!x.gameVersion)x.gameVersion=3; if(!x.trailers)x.trailers=[{id:1,type:'Firanka',cap:24,value:65000,condition:88}]; if(x.activeTrailerId==null)x.activeTrailerId=x.trailers[0]?.id||1;
 if(!x.contracts)x.contracts=[]; if(!x.loans)x.loans=[]; if(!x.leasePayments)x.leasePayments=[]; if(!x.events)x.events=[]; if(!x.achievements)x.achievements=[]; if(!x.ratings)x.ratings=[];
 if(!x.base)x.base={name:'Krzyżowice',level:1,warehouse:0,workshop:0,dispatchers:0};
 if(x.break15==null)x.break15=false; if(x.break45Due==null)x.break45Due=false; if(x.energy==null)x.energy=100; if(x.hunger==null)x.hunger=20; if(x.morale==null)x.morale=75; if(x.routeRisk==null)x.routeRisk=0; if(x.weekRestHours==null)x.weekRestHours=0; if(x.nightWork==null)x.nightWork=0; if(x.adrLicense==null)x.adrLicense=false; return x}catch(e){return fresh()}}
function save(){localStorage.ft20=JSON.stringify(state)}
function money(x){return Math.round(x).toLocaleString('pl-PL')+' zł'}
function hub(id){return HUBS.find(x=>x.id===id)}
function log(x){state.logs.unshift('Dzień '+state.day+': '+x);state.logs=state.logs.slice(0,40);save()}
function resetGame(){if(confirm('Na pewno wyzerować firmę?')){state=fresh();save();render()}}
function initHubs(){HUBS.forEach(h=>{if(!state.hubState[h.id])state.hubState[h.id]={congestion:Math.round(Math.random()*25),price:6+Math.random()*2}})}
initHubs();

// 2.4: poprawka realizmu tras. Usuwamy stare, wygenerowane dystanse z błędnej wersji.
if(state.routeVersion!==2){
  state.jobs=[];
  state.activeJob=null; state.progress=0; state.loaded=false;
  state.routeVersion=2;
  save();
}

const HUB_COORDS={
 WRO:[51.1079,17.0385],POZ:[52.4064,16.9252],BER:[52.5200,13.4050],HAM:[53.5511,9.9937],
 DUI:[51.4344,6.7623],RTM:[51.9244,4.4777],ANT:[51.2194,4.4025],PRG:[50.0755,14.4378],
 FRA:[50.1109,8.6821],MIL:[45.4642,9.1900],KRZ:[51.0330,16.9330],KAT:[51.0300,16.7670],
 DZL:[50.7280,16.6510],BIE:[51.0320,16.9680]
};
const LOCAL_ROUTE={
 'KRZ-WRO':20,'WRO-KRZ':20,'KAT-WRO':32,'WRO-KAT':32,'BIE-WRO':18,'WRO-BIE':18,
 'DZL-WRO':55,'WRO-DZL':55,'KRZ-BIE':16,'BIE-KRZ':16,'KAT-BIE':16,'BIE-KAT':16,
 'KRZ-KAT':17,'KAT-KRZ':17,'DZL-KRZ':48,'KRZ-DZL':48,'DZL-KAT':60,'KAT-DZL':60,
 'DZL-BIE':58,'BIE-DZL':58
};
function routeDistance(a,b){
 const key=a.id+'-'+b.id; if(LOCAL_ROUTE[key]) return LOCAL_ROUTE[key];
 const A=HUB_COORDS[a.id],B=HUB_COORDS[b.id];
 const R=6371,rad=Math.PI/180;
 const dLat=(B[0]-A[0])*rad,dLon=(B[1]-A[1])*rad;
 const q=Math.sin(dLat/2)**2+Math.cos(A[0]*rad)*Math.cos(B[0]*rad)*Math.sin(dLon/2)**2;
 const air=2*R*Math.asin(Math.sqrt(q));
 return Math.max(35,Math.round(air*1.18/5)*5);
}
function makeJobs(){
 state.jobs=[];
 const used=new Set();
 for(let i=0;i<8;i++){
  let a,b; do{a=HUBS[Math.floor(Math.random()*HUBS.length)];b=HUBS[Math.floor(Math.random()*HUBS.length)]}while(a.id===b.id||used.has(a.id+b.id));
  used.add(a.id+b.id);
  const c=CARGO[Math.floor(Math.random()*CARGO.length)], dist=routeDistance(a,b);
  const tons=Math.min(c[1],18+Math.floor(Math.random()*7));
  // Stawka jest liczona za kilometr, a nie za tonę — dzięki temu zlecenia mają sens ekonomiczny.
  const cargoMult = c[0]==='Chemia ADR' ? 1.22 : (c[0]==='Mrożonki' ? 1.12 : (c[0]==='Elektronika' ? 1.08 : 1.0));
  const laneMult = (a.country===b.country ? 1.00 : 1.10) * (0.94 + Math.random()*0.18);
  const demandMult = (0.82 + Math.random()*0.42);
  const rate = 5.45 * cargoMult * laneMult * demandMult;
  const pay=Math.round(dist*rate);
  state.jobs.push({id:Date.now()+i,from:a.id,to:b.id,cargo:c[0],tons,dist,pay,load:30+Math.round(a.handling*20),unload:25+Math.round(b.handling*18),deadline:8+Math.floor(Math.random()*30),adr:c[0]==='Chemia ADR'});
 }
 save()
}
if(!state.jobs.length)makeJobs();

function canDrive(min){
 const d=driver();
 if(d.driveToday>=540)return {ok:false,msg:'Limit 9 h jazdy na dziś osiągnięty. Potrzebny odpoczynek dobowy.'};
 if(d.driveToday+min>540)return {ok:false,msg:'Ten odcinek przekroczyłby 9 h jazdy dzisiaj.'};
 if(d.shift>=270 || d.shift+min>270)return {ok:false,msg:'Po maks. 4 h 30 min jazdy trzeba zrobić pauzę. Zatrzymaj się wcześniej, zanim rozpoczniesz kolejny odcinek.'};
 if(d.driveWeek+min>3360)return {ok:false,msg:'Limit 56 h jazdy w tygodniu zostałby przekroczony.'};
 if(state.energy<18)return {ok:false,msg:'Kierowca jest zbyt zmęczony. Zatrzymaj się i odpocznij.'};
 return {ok:true}
}
function drive(min){
 const c=canDrive(min);if(!c.ok){alert(c.msg);return}
 const d=driver(),t=truck(); d.driveToday+=min;d.driveWeek+=min;state.weekDrive+=min;state.fortDrive+=min;d.shift+=min;
 state.progress+=min; const km=Math.round(min*1.2); t.km+=km; state.companyKm+=km; t.condition=Math.max(0,t.condition-min*.015);
 const fuel=t.cons*(min/60)*1.05*(1+(100-state.energy)/1000); t.fuel=Math.max(0,t.fuel-fuel);
 state.energy=Math.max(0,state.energy-min/4.0); state.hunger=Math.min(100,state.hunger+min/7); state.morale=Math.max(0,state.morale-min/120); state.routeRisk=Math.min(100,state.routeRisk+min/8);
 if(d.shift>=270){state.lastEvent='⏸️ Po 4 h 30 min jazdy trzeba zrobić 45 min pauzy.';state.break45Due=true}
 if(Math.random()<0.10)routeEvent();
 if(Math.random()<0.035)randomBreakdown();
 if(state.companyKm>=10000)unlockAchievement('10k','Pierwsze 10 000 km'); if(state.companyKm>=100000)unlockAchievement('100k','100 000 km firmy');
 log('Przejechano '+(min/60).toFixed(2)+' h. Tachograf: '+fmt(d.shift)+' od ostatniej pauzy. Energia kierowcy '+Math.round(state.energy)+'%.');
 save();render()
}

 ];

 else if(min===30){if(state.break15){state.break15=false;d.shift=0;state.break45Due=false;state.energy=Math.min(100,state.energy+12);state.morale=Math.min(100,state.morale+4);log('⏸️ Pauza 30 min zakończyła podzieloną pauzę 15+30. Tachograf zresetowany.');}else{log('⏸️ Pauza 30 min — nie zastępuje pełnych 45 min po 4:30.');}}
 else if(min===45){state.break15=false;d.shift=0;state.break45Due=false;state.energy=Math.min(100,state.energy+18);state.morale=Math.min(100,state.morale+5);log('⏸️ Pełna pauza 45 min zaliczona.');}

function jobCosts(j){
 const t=truck(), d=driver();
 const fuelPrice=7.45; // PLN/l — łatwa do zmiany w ustawieniach ekonomii gry
 const fuelCost=j.dist*t.cons/100*fuelPrice;
 const tollRate=(hub(j.from).country==='DE'||hub(j.to).country==='DE')?0.95:0.65;
 const tollCost=j.dist*tollRate;
 const driverCost=j.dist/650*950; // orientacyjny koszt pracy kierowcy
 const maintenance=j.dist*0.38;
 const insurance=j.dist*0.10;
 const handling=180;
 const total=fuelCost+tollCost+driverCost+maintenance+insurance+handling;
 return {fuelCost,tollCost,driverCost,maintenance,insurance,handling,total,profit:j.pay-total,rate:j.pay/j.dist};
}
function profitBadge(j){

 return `<div class="notice ${c.profit>=0?'greenbox':'dangerbox'}">

 <div class="small muted">Stawka ${c.rate.toFixed(2)} zł/km • paliwo ${money(c.fuelCost)} • myto ${money(c.tollCost)} • kierowca ${money(c.driverCost)} • serwis ${money(c.maintenance)}</div></div>`;
}

 const c=jobCosts(j);
 state.money+=j.pay-c.total;state.rep=Math.min(100,state.rep+(c.profit>=0?2:-2));
 log('Rozładunek w '+h.name+' zakończony. Przychód '+money(j.pay)+', koszty '+money(c.total)+', wynik '+money(c.profit)+'.');
 if(j.contractId){const cc=state.contracts.find(x=>x.id===j.contractId);if(cc){cc.done++;cc.quality=Math.max(0,Math.min(100,cc.quality+(c.profit>=0?2:-5)));log('📑 Kontrakt '+cc.client+': '+cc.done+'/'+cc.need);if(cc.done>=cc.need){log('🏆 Kontrakt '+cc.client+' wykonany w całości!');state.rep=Math.min(100,state.rep+5)}}}else{const stars=c.profit>=0?(Math.random()<.75?5:4):(Math.random()<.5?3:2);state.ratings.unshift(stars);state.ratings=state.ratings.slice(0,20);log('⭐ Klient ocenił dostawę na '+stars+'/5.');if(stars===5)unlockAchievement('rating5','Klient dał 5 gwiazdek');}
state.activeJob=null;state.loaded=false;state.progress=0;state.hub=null; const at=truck(); if(at) at.currentHub=j.to;makeJobs();save();render()
}

}

function buyBaseUpgrade(type){const cfg={warehouse:[180000,'magazyn'],workshop:[220000,'warsztat'],dispatchers:[120000,'dyspozytor']}[type];if(!cfg)return;if(state.money<cfg[0]){alert('Za mało pieniędzy.');return}if(state.base[type]>=2){alert('Ten dział jest już na maksymalnym poziomie.');return}state.money-=cfg[0];state.base[type]++;log('🏢 Rozbudowano '+cfg[1]+' firmy.');save();render()}
function randomPlaceEvent(place){
 const events={parking:[['🅿️ Parking pełny','Trzeba szukać kolejnego miejsca. +10 min.'],['🚿 Prysznic nieczynny','Niestety, dziś bez prysznica.'],['🔧 Kierowca pomaga przy kole','Pomogłeś innemu kierowcy. Morale +4.'],['👮 Kontrola na parkingu','Szybka kontrola dokumentów.'],['🔊 Pogadanka na CB','Kilka ważnych informacji o trasie.']],station:[['⛽ Kolejka przy dystrybutorze','Tankowanie potrwa dłużej.'],['☕ Świeża kawa','Kierowca odzyskał energię.'],['💸 Promocja paliwa','Za tankowanie płacisz mniej.'],['🚿 Prysznic','Kierowca odświeżony.'],['🥪 Ciepła kanapka','Głód spada.']],bar:[['🍲 Domowy obiad','Głód spada mocno, morale rośnie.'],['☕ Kawa i ciasto','Krótki, przyjemny postój.'],['🗣️ Spotkanie z innym kierowcą','Nowa plotka z trasy trafia do CB.'],['🛏️ Można się zdrzemnąć','Dodatkowa regeneracja.']]};
 const e=events[place][Math.floor(Math.random()*events[place].length)];log(e[0]+' — '+e[1]);state.events.unshift({day:state.day,place,text:e[0]+' '+e[1]});state.events=state.events.slice(0,30);if(place==='station'&&e[0]==='☕ Świeża kawa')state.energy=Math.min(100,state.energy+8);if(place==='bar'&&e[0]==='🍲 Domowy obiad'){state.hunger=Math.max(0,state.hunger-35);state.morale=Math.min(100,state.morale+6)}if(place==='parking'&&e[0]==='🔧 Kierowca pomaga przy kole')state.morale=Math.min(100,state.morale+4);unlockAchievement('coffee','Kawa w trasie');save();render()
}
function visitPlace(place){randomPlaceEvent(place)}
function showRoutePlanner(){alert('🗺️ PLANER TRASY\\n\\nNajbliższe postoje i miejsca obsługi pojawiają się losowo podczas jazdy. Szukaj parkingu zanim tachograf dojdzie do 4:30.');}
function driverTrain(){const d=driver();const cost=4500;if(state.money<cost){alert('Za mało pieniędzy na szkolenie.');return}state.money-=cost;d.skill=Math.min(110,d.skill+2);d.safety=Math.min(110,d.safety+2);d.economy=Math.min(110,d.economy+2);log('🎓 Szkolenie kierowcy '+d.name+': +2 do wszystkich statystyk.');save();render()}
function hireDispatcher(){if(state.base.dispatchers>=2){alert('Masz już maksymalną liczbę dyspozytorów.');return}buyBaseUpgrade('dispatchers')}

function company(){
 const t=truck(),d=driver(),j=state.activeJob;
 return `<div class="grid">
 <div class="card stat"><span class="muted">KASA</span><b>${money(state.money)}</b></div>
 <div class="card stat"><span class="muted">DZIEŃ</span><b>${state.day}</b></div>
 <div class="card stat"><span class="muted">REPUTACJA</span><b>${state.rep}/100</b></div>
 <div class="card stat"><span class="muted">JAZDA TYG.</span><b>${fmt(state.weekDrive)}</b><span class="muted">limit 56 h</span></div>
 </div>
 <div class="cols"><div>
 <div class="card"><h2>🚛 ${t.model}</h2><div class="muted">${t.year} • ${Math.round(t.km).toLocaleString('pl-PL')} km • ${t.power} KM</div>
 <p>Stan <b>${Math.round(t.condition)}%</b> • paliwo <b>${Math.round(t.fuel)}%</b></p>
 <div class="progress"><i style="width:${t.condition}%"></i></div></div>
 <div class="card"><h2>📦 Aktualna operacja</h2>${j?jobProgress(j):`<p class="muted">Brak aktywnego zlecenia. Wejdź w Giełdę ładunków.</p>`}</div>
 <div class="card"><h2>📝 Dziennik</h2><div class="log">${state.logs.map(x=>'<div class="notice small">'+x+'</div>').join('')}</div></div>
 </div>
 <div><div class="card"><h2>⏱️ Tachograf</h2><p>Jazda dziś: <b>${fmt(d.driveToday)}</b> / 9 h</p><div class="progress"><i style="width:${d.driveToday/540*100}%"></i></div>
 <p>Od pauzy: <b>${fmt(d.shift)}</b> / 4 h 30</p><div class="progress"><i style="width:${d.shift/270*100}%"></i></div>
 <p class="small muted">W grze stosujemy zasady UE: po maks. 4 h 30 min jazdy potrzebna jest co najmniej 45-minutowa pauza; dobowy limit jazdy to 9 h, z możliwością 10 h dwa razy w tygodniu.</p>
 <div class="row"><button onclick="breakTime(45)">⏸️ Pauza 45 min</button><button class="secondary" onclick="rest(11)">🛏️ Odpoczynek 11 h</button></div></div>
 <div class="card"><h2>☕🚬 Kierowca</h2><p>Kawa: <b>${state.coffee}</b> • otwarta kawa: <b>${state.coffeeSips}/4 łyków pozostało</b> • Papierosy: <b>${state.cigarettes} szt.</b></p><button class="secondary" onclick="buyConsumable('coffee')">☕ Kup kawę 8 zł</button> <button class="secondary" onclick="buyConsumable('cigarettes')">🚬 Paczka 20 szt. 25 zł</button><br><button class="secondary" onclick="useConsumable('coffee')">☕ Łyk kawy</button> <button class="secondary" onclick="useConsumable('cigarettes')">🚬 Papieros</button><p class="muted">Kawa nie znika od razu — jeden kubek wystarcza na 5 łyków. Papierosy kupujesz paczkami po 20 sztuk.</p></div><div class="card"><h2>🌙 Koniec dnia</h2><p class="muted">Koszty stałe są pobierane przy zamknięciu dnia.</p><button onclick="endDay()">Zakończ dzień</button></div><div class="card"><h2>🏢 Firma</h2><p>Baza: <b>${state.base.name}</b> • magazyn ${state.base.warehouse}/2 • warsztat ${state.base.workshop}/2 • dyspozytorzy ${state.base.dispatchers}/2</p><button class="secondary" onclick="buyBaseUpgrade('warehouse')">🏭 Magazyn 180 tys.</button> <button class="secondary" onclick="buyBaseUpgrade('workshop')">🔧 Warsztat 220 tys.</button><br><button class="secondary" onclick="buyBaseUpgrade('dispatchers')">📞 Dyspozytor 120 tys.</button></div><div class="card"><h2>🏦 Finansowanie</h2><p>Aktywny kredyt: ${state.loans?.length?money(state.loans[0].balance):'brak'}</p><button class="secondary" onclick="takeLoan(100000)">Pożycz 100 tys.</button> <button class="secondary" onclick="payLoan()">Spłać ratę</button></div></div></div>`
}
function jobProgress(j){
 const p=Math.min(100,j.dist?state.progress/j.dist*100:0);
 return `<p><span class="pill">${j.cargo}${j.adr?' • ADR':''}</span> <span class="pill">${j.tons} t</span></p>
 <p><b>${hub(j.from).name}</b> → <b>${hub(j.to).name}</b> • ${j.dist} km</p>
 <div class="progress"><i style="width:${p}%"></i></div><p>${Math.round(state.progress)} / ${j.dist} km</p>
 <div class="row">${!state.loaded?`<button onclick="loadCargo()">📦 Załaduj</button>`:`<button onclick="drive(90)">🚛 Jedź 1:30</button><button onclick="drive(180)">🚛 Jedź 3:00</button>`}
 ${state.loaded?`<button class="secondary" onclick="breakTime(45)">⏸️ Pauza 45</button>`:''}
 ${state.loaded?`<button class="secondary" onclick="unloadCargo()">🏭 Rozładuj</button>`:''}</div>`
}
function jobs(){
 return `<div class="card"><div class="row"><h2>📋 Giełda ładunków</h2><button class="secondary" onclick="makeJobs();render()">↻ Odśwież</button></div>
 <div class="notice">💰 Rynek zmienia stawki. Naczepa ma znaczenie: chłodnia do mrożonek/żywności, cysterna do części ADR, platforma do stali i ciężkich ładunków.</div><div class="card"><div class="row"><h3>📑 Kontrakty</h3><button onclick="createContract()">➕ Nowy kontrakt</button></div>${state.contracts.length?state.contracts.map(c=>`<div class="notice small"><b>${c.client}</b> • ${hub(c.from).name} → ${hub(c.to).name} • ${c.done}/${c.need} • ${c.rate.toFixed(2)} zł/km <button class="secondary" onclick="contractJob(${c.id})" ${state.activeJob?'disabled':''}>Wykonaj</button></div>`).join(''):'<p class="muted">Brak kontraktów — wygeneruj pierwszy.</p>'}</div>
 <div class="list">${state.jobs.map(j=>`<div class="card"><div class="row"><div><b>${j.cargo}</b> ${j.adr?'<span class="pill">ADR</span>':''}<div class="muted">${hub(j.from).name} → ${hub(j.to).name} • ${j.dist} km • ${j.tons} t</div></div><div><b class="good">${money(j.pay)}</b><br><button onclick="accept(${j.id})" ${state.activeJob?'disabled':''}>Przyjmij</button></div></div>${profitBadge(j)}</div>`).join('')}</div></div>`
}
function hubs(){
 return `<div class="card"><h2>🏭 Huby logistyczne Europy</h2><p class="muted">Każdy hub ma własną przepustowość, parking, kongestię i usługi. Im większa kolejka, tym dłuższy załadunek/rozładunek.</p></div>
 <div class="grid">${HUBS.map(h=>{let s=state.hubState[h.id];return `<div class="card"><h3>🏭 ${h.name}</h3><span class="pill">${h.country} • ${h.type}</span><p>Przepustowość: <b>${h.capacity}%</b><br>Parking: <b>${h.parking}</b> miejsc<br>Kongestia: <b class="${s.congestion>70?'bad':''}">${s.congestion}%</b></p><div class="progress"><i style="width:${s.congestion}%"></i></div><p class="small muted">Usługi: ${h.services.join(' • ')}</p></div>`}).join('')}</div>`
}
function fleet(){
 return `<div class="card"><h2>🚛 Flota</h2><p class="muted">Kupuj ciężarówki, tankuj i pilnuj stanu technicznego.</p></div>
 <div class="list">${state.trucks.map(t=>`<div class="card"><div class="row"><div><h3>${t.model}</h3><div class="muted">${t.year} • ${Math.round(t.km).toLocaleString('pl-PL')} km • ${t.power} KM</div></div><span class="pill">Stan ${Math.round(t.condition)}%</span></div><p>Tablica: <b>${t.plate||'DWR 00001'}</b><br>Paliwo ${Math.round(t.fuel)}% • spalanie ${t.cons} l/100 km</p><button ${state.truckId===t.id?'disabled':''} onclick="selectTruck(${t.id})">${state.truckId===t.id?'🚛 Aktywny':'Użyj tego zestawu'}</button> <button class="secondary" onclick="refuel(${t.id})">⛽ Tankuj</button> <button class="secondary" onclick="repair(${t.id})">🔧 Serwis</button> <button class="secondary" onclick="plate(${t.id})">🔤 Tablica</button><details style="margin-top:10px"><summary>🔧 Modyfikacje</summary><p class="small muted">Silnik +80 KM • opony -1 l/100 km • zbiornik + paliwo • kabina + stan</p><button class="secondary" onclick="modifyTruck(${t.id},'engine')">Silnik 85 tys.</button> <button class="secondary" onclick="modifyTruck(${t.id},'tires')">Opony 18 tys.</button> <button class="secondary" onclick="modifyTruck(${t.id},'tank')">Zbiornik 12 tys.</button> <button class="secondary" onclick="modifyTruck(${t.id},'comfort')">Kabina 22 tys.</button></details></div>`).join('')}</div>
 <div class="card"><h2>🧰 Naczepy</h2><p>Aktywna: <b>${activeTrailer()?.type||'brak'}</b></p><div class="list">${state.trailers.map(t=>`<div class="notice small"><b>${t.type}</b> • ${t.cap} t • stan ${Math.round(t.condition)}% <button ${state.activeTrailerId===t.id?'disabled':''} class="secondary" onclick="selectTrailer(${t.id})">${state.activeTrailerId===t.id?'Aktywna':'Podepnij'}</button></div>`).join('')}</div><details><summary>🛒 Kup naczepę</summary>${TRAILERS.map((x,i)=>`<div class="row" style="padding:8px 0;border-bottom:1px solid #263650"><span><b>${x.type}</b><br><span class="muted">${x.desc}</span></span><span><b>${money(x.price)}</b> <button onclick="buyTrailer(${i})">Kup</button></span></div>`).join('')}</details></div>
 <div class="card"><h2>🛒 Rynek ciężarówek</h2>${TRUCKS.map((x,i)=>`<div class="row" style="padding:10px 0;border-bottom:1px solid #263650"><span><b>${x.name}</b><br><span class="muted">${x.year} • ${x.power} KM • ${x.cons} l/100 km</span></span><span><b>${money(x.price)}</b> <button onclick="buyTruck(${i})">Kup</button></span></div>`).join('')}</div>`
}
function drivers(){
 const specialHtml=SPECIAL_DRIVERS.map(cfg=>{const d=state.drivers.find(x=>x.name===cfg.name); const unlocked=state.companyKm>=cfg.unlockKm; return d ? `<div class="card"><h3>⭐ ${cfg.name}</h3><p class="muted">${d.bio||cfg.bio}</p><p>Doświadczenie <b>${d.skill}</b>/110<br>Bezpieczeństwo <b>${d.safety}</b>/110<br>Ekonomia <b>${d.economy}</b>/110</p><button ${state.driverId===d.id?'disabled':''} onclick="selectDriver(${d.id})">${state.driverId===d.id?'🚛 Aktualnie prowadzi':'Wybierz kierowcę'}</button></div>` : `<div class="card"><h3>🔒 ${cfg.name}</h3><p>${cfg.bio}</p><p>Odblokowanie: <b>${fmt(cfg.unlockKm)} km</b><br>Twój przebieg firmy: <b>${fmt(state.companyKm)} km</b></p><button ${unlocked?'':'disabled'} onclick="unlockSpecial('${cfg.name}')">${unlocked?'🔓 Odblokuj':'🔒 Jeszcze zablokowany'}</button></div>`}).join('');
 return `<div class="card"><div class="row"><div><h2>👨‍🔧 Kierowcy</h2><p class="muted">Umiejętności wpływają na spalanie, bezpieczeństwo i reputację. Aktywny kierowca prowadzi aktualną trasę.</p></div><button onclick="hire()">➕ Zatrudnij</button></div><p>🏁 Przebieg firmy: <b>${fmt(state.companyKm)} km</b></p></div>
 <div class="grid">${state.drivers.map(d=>`<div class="card"><h3>👤 ${d.name} ${state.driverId===d.id?'🚛':''}</h3><p>${d.bio?d.bio+'<br>':''}Doświadczenie <b>${d.skill}</b>/110<br>Bezpieczeństwo <b>${d.safety}</b>/110<br>Ekonomia <b>${d.economy}</b>/110</p><p>Jazda dziś: ${fmt(d.driveToday)}<br>Tydzień: ${fmt(d.driveWeek)}<br>Pensja: ${money(d.salary)}/mies.</p><button ${state.driverId===d.id?'disabled':''} onclick="selectDriver(${d.id})">${state.driverId===d.id?'🚛 Aktualnie prowadzi':'Wybierz kierowcę'}</button> <button class="secondary" onclick="driverTrain()">🎓 Szkolenie</button> ${state.driverId!==d.id?`<button class=\"secondary\" onclick=\"fireDriver(${d.id})\">🗑️ Zwolnij</button>`:''}</div>`).join('')}</div>
 <div class="grid">${specialHtml}</div>
 <div class="card"><h2>🏆 Osiągnięcia</h2><p>${state.achievements?.length||0}/${ACHIEVEMENTS.length} odblokowanych</p><div class="small">${ACHIEVEMENTS.map(a=>`<span class="pill" style="margin:3px">${state.achievements?.includes(a[0])?'🏆':'🔒'} ${a[1]}</span>`).join('')}</div></div>
 <div class="card"><h2>🛌 Odpoczynki</h2><p class="muted">Regularny odpoczynek dobowy to co najmniej 11 h; skrócony może wynosić 9 h w określonych warunkach. Tygodniowy regularny odpoczynek to 45 h, a skrócony może być krótszy, ale nie mniej niż 24 h.</p><button onclick="rest(11)">🛏️ 11 h</button> <button class="secondary" onclick="rest(9)">🛏️ 9 h skrócony</button> <button class="secondary" onclick="weeklyRest(24)">📅 Tygodniowy 24 h</button> <button class="secondary" onclick="weeklyRest(45)">📅 Tygodniowy 45 h</button></div>`
}

function routeTab(){
 const t=truck(),d=driver(),tr=activeTrailer();
 return `<div class="grid"><div class="card stat"><span class="muted">ENERGIA</span><b>${Math.round(state.energy)}%</b></div><div class="card stat"><span class="muted">GŁÓD</span><b>${Math.round(state.hunger)}%</b></div><div class="card stat"><span class="muted">MORALE</span><b>${Math.round(state.morale)}%</b></div><div class="card stat"><span class="muted">RYZYKO TRASY</span><b>${Math.round(state.routeRisk)}%</b></div></div>
 <div class="cols"><div><div class="card"><h2>🛣️ Życie na trasie</h2><p>🚛 ${t.model} • ${tr?.type||'Firanka'} • 👤 ${d.name}</p><p>Od pauzy: <b>${fmt(d.shift)}</b> / 4h30 • Jazda dziś: <b>${fmt(d.driveToday)}</b></p><div class="progress"><i style="width:${Math.min(100,d.shift/270*100)}%"></i></div><div class="row"><button onclick="visitPlace('parking')">🅿️ Parking / MOP</button><button onclick="visitPlace('station')">⛽ Stacja</button><button onclick="visitPlace('bar')">🍽️ Bar</button></div></div>
 <div class="card"><h2>📍 Planer</h2><p class="muted">Podczas jazdy mogą pojawić się korki, kontrole, awarie, objazdy i komunikaty CB.</p><button class="secondary" onclick="showRoutePlanner()">🗺️ Sprawdź trasę</button></div>
 <div class="card"><h2>📻 CB radio</h2><p>„Marian do wszystkich — jak A4?”</p><p class="muted">Losowe komunikaty mogą ostrzec o korku, kontroli albo problemie na trasie.</p></div></div>
 <div><div class="card"><h2>⏱️ Realna pauza</h2><p>Po maksymalnie 4:30 jazdy musi być 45 min przerwy. Możesz zrobić <b>15 + 30 min</b> w tej kolejności.</p><button onclick="breakTime(15)">⏸️ 15 min</button> <button class="secondary" onclick="breakTime(30)">⏸️ 30 min</button> <button class="secondary" onclick="breakTime(45)">⏸️ 45 min</button><p class="small muted">Stan podzielonej pauzy: ${state.break15?'15 min wykonane — zostało 30 min.':'brak rozpoczętej podzielonej pauzy.'}</p></div>
 <div class="card"><h2>🎲 Ostatnie zdarzenia</h2>${state.events?.slice(0,8).map(e=>`<div class="notice small">Dzień ${e.day} • ${e.place} • ${e.text}</div>`).join('')||'<p class="muted">Jeszcze nic się nie wydarzyło.</p>'}</div></div></div>`
}


function mapTruckPosition(t){
 const job=state.activeJob&&state.truckId===t.id?state.activeJob:null;
 if(job){
  const a=HUB_COORDS[job.from],b=HUB_COORDS[job.to];
  const p=Math.max(0,Math.min(1,state.progress/Math.max(1,job.dist)));
  return [a[0]+(b[0]-a[0])*p,a[1]+(b[1]-a[1])*p];
 }
 const h=hub(t.currentHub||state.hub||'KRZ')||HUBS.find(x=>x.id==='KRZ');
 return HUB_COORDS[h.id];
}
function mapFleet(){
 return `<div class="card"><h2>🗺️ Mapa floty Europy</h2>
 <p class="muted">Podgląd pozycji zestawów. Aktywna ciężarówka przesuwa się po swojej trasie wraz z postępem zlecenia.</p>
 <div id="fleetMap"></div>
 <div class="map-legend"><span>📍 Hub</span><span>🚛 Aktywna ciężarówka</span><span>🅿️ Pozostała flota</span></div></div>
 <div class="card"><h3>🚛 Pozycje floty</h3>
 <div class="list">${state.trucks.map(t=>{
  const j=state.activeJob&&state.truckId===t.id?state.activeJob:null;
  const pos=j?`${hub(j.from).name} → ${hub(j.to).name} • ${Math.round(state.progress)}/${j.dist} km`:(hub(t.currentHub||'KRZ')?.name||'Krzyżowice');
  return `<div class="notice"><b>${t.plate||'DWR'}</b> • ${t.model}<br><span class="muted">${pos}</span></div>`;
 }).join('')}</div></div>`;
}
function initFleetMap(){
 const el=document.getElementById('fleetMap');if(!el||typeof L==='undefined')return;
 if(window.ftMap){window.ftMap.remove();window.ftMap=null}
 const map=L.map(el,{zoomControl:true}).setView([51.3,15.5],5);
 L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:18,attribution:'&copy; OpenStreetMap contributors'}).addTo(map);
 HUBS.forEach(h=>{
  const m=L.marker(HUB_COORDS[h.id]).addTo(map);
  m.bindPopup(`<b>🏭 ${h.name}</b><br>${h.country} • ${h.type}<br>Parking: ${h.parking} miejsc`);
 });
 state.trucks.forEach(t=>{
  const p=mapTruckPosition(t),active=state.activeJob&&state.truckId===t.id;
  const icon=L.divIcon({className:'truck-marker',html:`<div style="font-size:25px;filter:drop-shadow(0 2px 2px #000)">${active?'🚛':'🅿️'}</div>`,iconSize:[30,30],iconAnchor:[15,15]});
  const m=L.marker(p,{icon}).addTo(map),j=active?state.activeJob:null;
  const desc=j?`${hub(j.from).name} → ${hub(j.to).name}<br>Postęp: ${Math.round(state.progress)}/${j.dist} km<br>Kierowca: ${driver().name}`:`Hub: ${(hub(t.currentHub||'KRZ')||{}).name||'Krzyżowice'}`;
  m.bindPopup(`<b>${t.plate||'DWR'}</b><br>${t.model}<br>${desc}<br>Paliwo: ${Math.round(t.fuel)}%<br>Stan: ${Math.round(t.condition)}%`);
  if(j){L.polyline([HUB_COORDS[j.from],HUB_COORDS[j.to]],{dashArray:'8 8'}).addTo(map)}
 });
 window.ftMap=map;setTimeout(()=>map.invalidateSize(),120);
}

function render(){
 initHubs();
 ['company','jobs','hubs','fleet','map','drivers','overload','route'].forEach(x=>document.getElementById('t-'+x).classList.toggle('active',x===tab));
 document.getElementById('app').innerHTML=tab==='company'?company():tab==='jobs'?jobs():tab==='hubs'?hubs():tab==='fleet'?fleet():tab==='map'?mapFleet():tab==='drivers'?drivers():tab==='route'?routeTab():overload(); if(tab==='map')initFleetMap();
}
render();
</script>
</body>
</html>
